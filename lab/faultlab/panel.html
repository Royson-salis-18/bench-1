<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Faultlab panel</title>
<style>
:root{--bg:#0f1115;--card:#171a21;--ink:#e6e8ee;--mut:#8b93a3;--line:#262b36;--acc:#6b8cff;--bad:#ef6a5b;--ok:#4cc38a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,sans-serif;padding:20px;max-width:1100px;margin:auto}
h1{font-size:18px;margin:0 0 4px}p.s{color:var(--mut);margin:0 0 16px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:800px){.g{grid-template-columns:1fr}}
.c{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}.c h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:0 0 10px}
label{display:block;color:var(--mut);font-size:12px;margin:8px 0 3px}input,select{width:100%;background:#0f1218;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:7px}
button{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:8px 12px;cursor:pointer;font-weight:600}button.x{background:transparent;border:1px solid var(--line);color:var(--ink)}button.d{background:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;user-select:none}.chip.on{border-color:var(--acc);background:#6b8cff22}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--mut)}.running .dot{background:var(--ok)}.exited .dot,.paused .dot,.restarting .dot{background:var(--bad)}
pre{margin:0;max-height:220px;overflow:auto;font-size:12px;color:var(--mut)}#msg{color:var(--bad);min-height:18px;font-size:12px}
</style>
<h1>Faultlab panel <span id=sub style="color:var(--mut);font-weight:400"></span></h1>
<p class=s>Choose where faults may land and how hard. The mapper is not told anything; it has to notice by itself. Everything is written to the private ledger.</p>
<div id=msg></div>
<div class=g>
<div class=c><h2>Campaign (random faults)</h2><div id=cstat style="color:var(--mut);margin-bottom:6px"></div>
<label>Profile</label><select id=profile></select>
<label>Duration (minutes)</label><input id=minutes type=number value=30 min=1 max=480>
<label>Faults per minute (blank = profile default)</label><input id=rate type=number step=0.05 placeholder="profile default">
<label>Max faults at once</label><input id=maxc type=number min=1 placeholder="profile default">
<label>Seed (blank = random)</label><input id=seed placeholder="reproducible if set">
<label>Fault types allowed (none selected = all)</label><div class=chips id=classes></div>
<label>Services faults may hit (none selected = all)</label><div class=chips id=targets></div>
<div class=row><button id=start>Start campaign</button><button class=d id=stop>Stop and heal</button></div></div>
<div class=c><h2>One fault by hand</h2>
<label>Service</label><select id=isvc></select><label>Fault</label><select id=icls></select>
<label>Severity (0.1 - 1)</label><input id=isev type=number step=0.1 value=0.8 min=0.1 max=1><label>Hold for (seconds)</label><input id=isec type=number value=60>
<div class=row><button id=inj>Inject</button><button class=x id=healall>Heal everything</button></div>
<h2 style="margin-top:18px">Traffic</h2><div id=tstat style="color:var(--mut)"></div>
<label>Average requests per second</label><input id=rps type=number step=0.1 placeholder="default"><label>Shape</label><select id=mode><option value=organic>organic (daily wave, bursts)</option><option value=steady>steady</option></select>
<div class=row><button id=tstart>Start / apply</button><button class=x id=tstop>Stop traffic</button></div></div>
<div class=c><h2>Services</h2><div id=svcs></div></div>
<div class=c><h2>Log</h2><pre id=log></pre></div>
</div>
<script>
const $=i=>document.getElementById(i),sel={classes:new Set,targets:new Set};
const post=async(u,b)=>{const r=await(await fetch(u,{method:'POST',headers:{'x-panel':'1','content-type':'application/json'},body:JSON.stringify(b||{})})).json();$('msg').textContent=r.error||'';return r};
function chips(id,items,set){const el=$(id);if(el.dataset.built)return;el.dataset.built=1;items.forEach(n=>{const c=document.createElement('span');c.className='chip';c.textContent=n;c.onclick=()=>{set.has(n)?set.delete(n):set.add(n);c.classList.toggle('on')};el.append(c)})}
async function tick(){const s=await(await fetch('/api/state')).json();$('sub').textContent='· '+s.subject;
if(!$('profile').options.length){s.profiles.forEach(p=>$('profile').add(new Option(p,p)));$('profile').value='realistic';s.services.forEach(v=>$('isvc').add(new Option(v.name+' ('+v.role+')',v.name)));s.classes.forEach(c=>$('icls').add(new Option(c.name+' - '+c.desc,c.name)))}
chips('classes',s.classes.map(c=>c.name),sel.classes);chips('targets',s.services.map(v=>v.name),sel.targets);
$('cstat').textContent=s.campaign?'running since '+new Date(s.campaign.startedAt).toLocaleTimeString()+' ('+s.campaign.args.join(' ')+')':'not running';
$('tstat').textContent='traffic container: '+s.traffic;
$('svcs').innerHTML=s.services.map(v=>'<div class="'+v.state+'"><span class=dot></span>'+v.name+' <span style="color:var(--mut)">'+v.role+' - '+v.state+'</span></div>').join('');
$('log').textContent=s.log.join('\n')}
$('start').onclick=()=>post('/api/campaign',{profile:$('profile').value,minutes:$('minutes').value,ratePerMin:$('rate').value,maxConcurrent:$('maxc').value,seed:$('seed').value,classes:[...sel.classes],targets:[...sel.targets]}).then(tick);
$('stop').onclick=()=>post('/api/stop').then(tick);$('healall').onclick=()=>post('/api/heal').then(tick);
$('inj').onclick=()=>post('/api/inject',{service:$('isvc').value,class:$('icls').value,severity:$('isev').value,seconds:$('isec').value}).then(tick);
$('tstart').onclick=()=>post('/api/traffic',{action:'start',baseRps:$('rps').value,mode:$('mode').value}).then(tick);$('tstop').onclick=()=>post('/api/traffic',{action:'stop'}).then(tick);
tick();setInterval(tick,3000);
</script>
